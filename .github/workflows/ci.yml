name: Sentum Core CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: sentum-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl libcurl4-openssl-dev libssl-dev libboost-system-dev libasio-dev libwebsocketpp-dev libsqlite3-dev nlohmann-json3-dev
      - name: Configure release, tests and benchmarks
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DSENTUM_BUILD_BENCHMARKS=ON
      - name: Build release
        run: cmake --build build --parallel
      - name: Run regression tests
        run: ctest --test-dir build --output-on-failure --timeout 60
      - name: Run operational acceptance cycles
        shell: bash
        run: |
          set +e
          python3 tools/ci/operational_acceptance.py \
            --build-dir build \
            --cycles 5 \
            --timeout-seconds 90 \
            --report log/operational_acceptance.json \
            --summary log/operational_acceptance.md
          status=$?
          if [[ -f log/operational_acceptance.md ]]; then
            cat log/operational_acceptance.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - name: Upload operational acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentum-operational-acceptance-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            log/operational_acceptance.json
            log/operational_acceptance.md
      - name: Smoke test unified CLI
        run: |
          ./sentum help | grep 'Sentum unified CLI'
          ./sentum --help | grep 'sentum paper'
          ./sentum version | grep 'Sentum '
          ./sentum --version | grep 'Sentum '
          if ./sentum unknown-command >/tmp/cli-invalid.log 2>&1; then exit 1; fi
          grep 'unknown command' /tmp/cli-invalid.log
      - name: Enforce performance budgets
        shell: bash
        run: |
          set +e
          python3 tools/ci/performance_gate.py \
            --build-dir build \
            --budget-file benchmarks/performance_budgets.json \
            --report log/performance_gate.json \
            --summary log/performance_gate.md
          status=$?
          if [[ -f log/performance_gate.md ]]; then
            cat log/performance_gate.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - name: Observe scanner hot path
        shell: bash
        run: |
          mkdir -p log
          ./build/sentum_scanner_hot_path_benchmark 500 200 | tee log/scanner_hot_path_500.txt
          ./build/sentum_scanner_hot_path_benchmark 1000 100 | tee log/scanner_hot_path_1000.txt
          ./build/sentum_scanner_hot_path_benchmark 2000 50 | tee log/scanner_hot_path_2000.txt
          {
            echo '## Scanner hot path observation'
            echo ''
            echo 'These measurements are OBSERVED evidence only; AP-03 does not turn them into a production SLA.'
            echo ''
            echo '```text'
            cat log/scanner_hot_path_500.txt
            echo
            cat log/scanner_hot_path_1000.txt
            echo
            cat log/scanner_hot_path_2000.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Observe dashboard snapshot polling
        shell: bash
        run: |
          mkdir -p log
          ./build/sentum_dashboard_snapshot_benchmark 250000 | tee log/dashboard_snapshot.txt
          {
            echo '## Dashboard snapshot observation'
            echo ''
            echo 'This is OBSERVED evidence for the AP-05 snapshot architecture; it is not a production SLA.'
            echo ''
            echo '```text'
            cat log/dashboard_snapshot.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Observe terminal render pipeline
        shell: bash
        run: |
          mkdir -p log
          ./build/sentum_terminal_render_pipeline_benchmark 250000 | tee log/terminal_render_pipeline.txt
          {
            echo '## Terminal render pipeline observation'
            echo ''
            echo 'This is OBSERVED evidence for AP-06; unchanged frames must emit zero terminal payload bytes.'
            echo ''
            echo '```text'
            cat log/terminal_render_pipeline.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentum-performance-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            log/performance_gate.json
            log/performance_gate.md
            log/scanner_hot_path_500.txt
            log/scanner_hot_path_1000.txt
            log/scanner_hot_path_2000.txt
            log/dashboard_snapshot.txt
            log/terminal_render_pipeline.txt
      - name: Smoke test quant research
        shell: bash
        run: |
          python3 - <<'PY'
          import json, math
          with open('/tmp/research.csv', 'w') as f:
              f.write('timestamp_ms,price,volume\n')
              for i in range(360):
                  trend = i * 0.015
                  cycle = math.sin(i / 6.0) * 1.8
                  f.write(f'{1710000000000 + i * 1000},{100.0 + trend + cycle:.8f},1.0\n')
          with open('/tmp/research.json', 'w') as f:
              json.dump({
                  'dataset': '/tmp/research.csv',
                  'symbol': 'BTCUSDT',
                  'objective': 'sharpe',
                  'train_fraction': 0.7,
                  'walk_forward_folds': 2,
                  'max_trials': 8,
                  'leaderboard_size': 4,
                  'grid': {
                      'lookback': [5, 10],
                      'entry_threshold': [0.001, 0.002]
                  }
              }, f)
          PY
          ./sentum research /tmp/research.json
          cp log/research_trials.csv /tmp/research_trials_first.csv
          python3 - <<'PY'
          import csv, json
          with open('log/research_latest.json') as f:
              report = json.load(f)
          assert report['trials'] == 4
          assert report['folds'] == 2
          assert len(report['leaderboard']) == 4
          assert report['leaderboard'][0]['validation_score'] >= report['leaderboard'][-1]['validation_score']
          with open('log/research_trials.csv') as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == 4
          PY
          ./sentum --research /tmp/research.json
          cmp /tmp/research_trials_first.csv log/research_trials.csv
      - name: Smoke test dashboard
        shell: bash
        run: timeout --signal=TERM --kill-after=5s 60s bash tools/ci/dashboard_smoke.sh

  sanitizers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan
            option: SENTUM_ENABLE_ASAN
          - name: UBSan
            option: SENTUM_ENABLE_UBSAN
          - name: TSan
            option: SENTUM_ENABLE_TSAN
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libcurl4-openssl-dev libssl-dev libboost-system-dev libasio-dev libwebsocketpp-dev libsqlite3-dev nlohmann-json3-dev
      - name: Configure ${{ matrix.name }}
        run: cmake -S . -B build-sanitizer -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -D${{ matrix.option }}=ON
      - name: Build ${{ matrix.name }}
        run: cmake --build build-sanitizer --parallel 2 --target sentum sentum_runtime_lifecycle_tests sentum_market_hot_path_tests sentum_runtime_observability_tests sentum_dashboard_snapshot_tests sentum_terminal_ui_policy_tests sentum_terminal_render_pipeline_tests sentum_terminal_workspace_policy_tests sentum_operational_safety_policy_tests
      - name: Run regression tests under ${{ matrix.name }}
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build-sanitizer --output-on-failure --timeout 60
