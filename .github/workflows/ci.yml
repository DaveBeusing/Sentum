name: Sentum Core CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: sentum-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl libcurl4-openssl-dev libssl-dev libboost-system-dev libasio-dev libwebsocketpp-dev libsqlite3-dev nlohmann-json3-dev
      - name: Configure release, tests and benchmarks
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DSENTUM_BUILD_BENCHMARKS=ON
      - name: Build release
        run: cmake --build build --parallel
      - name: Run regression tests
        run: ctest --test-dir build --output-on-failure --timeout 60
      - name: Run operational acceptance cycles
        shell: bash
        run: |
          set +e
          python3 tools/ci/operational_acceptance.py \
            --build-dir build \
            --cycles 5 \
            --timeout-seconds 90 \
            --report log/operational_acceptance.json \
            --summary log/operational_acceptance.md
          status=$?
          if [[ -f log/operational_acceptance.md ]]; then
            cat log/operational_acceptance.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - name: Upload operational acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentum-operational-acceptance-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            log/operational_acceptance.json
            log/operational_acceptance.md
      - name: Run bounded runtime qualification smoke
        shell: bash
        run: |
          mkdir -p log/runtime-qualification
          status=0
          python3 tools/ci/runtime_qualification.py \
            --build-dir build \
            --scenario paper-soak \
            --duration-seconds 2 \
            --seed 1 \
            --timeout-seconds 30 \
            --max-rss-growth-kib 65536 \
            --output log/runtime-qualification/paper-soak.json \
            --summary log/runtime-qualification/paper-soak.md || status=$?
          python3 tools/ci/runtime_qualification.py \
            --build-dir build \
            --scenario all-faults \
            --duration-seconds 1 \
            --seed 1 \
            --timeout-seconds 60 \
            --max-rss-growth-kib 65536 \
            --output log/runtime-qualification/all-faults.json \
            --summary log/runtime-qualification/all-faults.md || status=$?
          for summary in log/runtime-qualification/*.md; do
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$status"
      - name: Upload runtime qualification smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentum-runtime-qualification-smoke-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: log/runtime-qualification/
      - name: Smoke test unified CLI
        run: |
          ./sentum help | grep 'Sentum unified CLI'
          ./sentum --help | grep 'sentum paper'
          ./sentum version | grep 'Sentum '
          ./sentum --version | grep 'Sentum '
          if ./sentum unknown-command >/tmp/cli-invalid.log 2>&1; then exit 1; fi
          grep 'unknown command' /tmp/cli-invalid.log
      - name: Validate performance gate evaluator
        run: python3 tests/performance_gate_tests.py
      - name: Validate independent research verifier
        run: python3 tests/research_validation_tests.py
      - name: Enforce performance budgets
        shell: bash
        run: |
          set +e
          python3 tools/ci/performance_gate.py \
            --build-dir build \
            --budget-file benchmarks/performance_budgets.json \
            --qualification-report log/runtime-qualification/paper-soak.json \
            --qualification-report log/runtime-qualification/all-faults.json \
            --report log/performance_gate.json \
            --summary log/performance_gate.md
          status=$?
          if [[ -f log/performance_gate.md ]]; then
            cat log/performance_gate.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentum-performance-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            log/performance_gate.json
            log/performance_gate.md
      - name: Smoke test quant research
        shell: bash
        run: |
          python3 - <<'PY'
          import json, math
          with open('/tmp/research.csv', 'w') as f:
              f.write('timestamp_ms,price,volume\n')
              for i in range(360):
                  trend = i * 0.015
                  cycle = math.sin(i / 6.0) * 1.8
                  f.write(f'{1710000000000 + i * 1000},{100.0 + trend + cycle:.8f},1.0\n')
          with open('/tmp/research.json', 'w') as f:
              json.dump({
                  'dataset': '/tmp/research.csv',
                  'symbol': 'BTCUSDT',
                  'objective': 'sharpe',
                  'train_fraction': 0.7,
                  'walk_forward_folds': 2,
                  'max_trials': 8,
                  'leaderboard_size': 4,
                  'grid': {
                      'lookback': [5, 10],
                      'entry_threshold': [0.001, 0.002]
                  }
              }, f)
          PY
          ./sentum research /tmp/research.json
          cp log/research_trials.csv /tmp/research_trials_first.csv
          python3 - <<'PY'
          import csv, json
          with open('log/research_latest.json') as f:
              report = json.load(f)
          assert report['trials'] == 4
          assert report['folds'] == 2
          assert len(report['leaderboard']) == 4
          assert report['leaderboard'][0]['validation_score'] >= report['leaderboard'][-1]['validation_score']
          with open('log/research_trials.csv') as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == 4
          PY
          ./sentum --research /tmp/research.json
          cmp /tmp/research_trials_first.csv log/research_trials.csv
      - name: Validate canonical managed research experiment
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/sentum-research-validation
          rm -rf "$root"
          mkdir -p "$root/experiments"
          python3 - <<'PY'
          import json, math
          from pathlib import Path

          root = Path('/tmp/sentum-research-validation')
          base_ms = 1710000000000
          rows = 360
          with (root / 'market.csv').open('w') as f:
              f.write('timestamp_ms,price,volume\n')
              for i in range(rows):
                  trend = i * 0.015
                  cycle = math.sin(i / 6.0) * 1.8
                  f.write(f'{base_ms + i * 1000},{100.0 + trend + cycle:.8f},1.0\n')

          (root / 'datasets.json').write_text(json.dumps({
              'datasets': [{
                  'id': 'canonical-ci-dataset',
                  'symbol': 'BTCUSDT',
                  'path': str(root / 'market.csv'),
                  'interval': '1s',
                  'start_ms': base_ms,
                  'end_ms': base_ms + (rows - 1) * 1000,
              }]
          }, indent=2) + '\n')

          (root / 'research.json').write_text(json.dumps({
              'dataset': 'managed-by-experiment',
              'symbol': 'BTCUSDT',
              'objective': 'sharpe',
              'train_fraction': 0.60,
              'holdout_fraction': 0.20,
              'walk_forward_folds': 2,
              'purge_events': 2,
              'embargo_events': 1,
              'min_validation_trades': 0,
              'max_trials': 4,
              'leaderboard_size': 4,
              'monte_carlo_samples': 64,
              'bootstrap_samples': 64,
              'random_seed': 42,
              'parallelism': 1,
              'grid': {
                  'lookback': [5, 10],
                  'entry_threshold': [0.0005, 0.001],
              },
          }, indent=2) + '\n')

          (root / 'experiment.json').write_text(json.dumps({
              'name': 'canonical-independent-validation',
              'kind': 'research',
              'dataset_catalog': str(root / 'datasets.json'),
              'research_config': str(root / 'research.json'),
              'risk_config': 'config/risk.json',
              'output_root': str(root / 'experiments'),
              'registry_path': str(root / 'experiments.sqlite3'),
              'datasets': [{'id': 'canonical-ci-dataset'}],
          }, indent=2) + '\n')
          PY

          ./build/sentum_experiment "$root/experiment.json"
          first="$(find "$root/experiments" -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)"
          python3 tools/verify_research.py "$first" --registry "$root/experiments.sqlite3"
          sleep 0.05
          ./build/sentum_experiment "$root/experiment.json"
          second="$(find "$root/experiments" -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)"
          test "$first" != "$second"
          python3 tools/verify_research.py "$second" --registry "$root/experiments.sqlite3" --reference-run "$first"
          mkdir -p log
          cp "$second/research-validation.json" log/research_validation.json
      - name: Upload independent research validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentum-research-validation-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: log/research_validation.json
      - name: Smoke test dashboard
        shell: bash
        run: timeout --signal=TERM --kill-after=5s 60s bash tools/ci/dashboard_smoke.sh
      - name: Upload release candidate binary input
        uses: actions/upload-artifact@v4
        with:
          name: sentum-rc-binary-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: sentum

  sanitizers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan
            option: SENTUM_ENABLE_ASAN
          - name: UBSan
            option: SENTUM_ENABLE_UBSAN
          - name: TSan
            option: SENTUM_ENABLE_TSAN
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libcurl4-openssl-dev libssl-dev libboost-system-dev libasio-dev libwebsocketpp-dev libsqlite3-dev nlohmann-json3-dev
      - name: Configure ${{ matrix.name }}
        run: cmake -S . -B build-sanitizer -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -D${{ matrix.option }}=ON
      - name: Build ${{ matrix.name }}
        run: cmake --build build-sanitizer --parallel 2 --target sentum sentum_runtime_lifecycle_tests sentum_market_hot_path_tests sentum_runtime_observability_tests sentum_dashboard_snapshot_tests sentum_terminal_ui_policy_tests sentum_terminal_render_pipeline_tests sentum_terminal_workspace_policy_tests sentum_operational_safety_policy_tests sentum_runtime_qualification_scenarios
      - name: Run regression tests under ${{ matrix.name }}
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build-sanitizer --output-on-failure --timeout 60

  release_readiness:
    name: Release readiness
    needs:
      - build
      - sanitizers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download performance evidence
        uses: actions/download-artifact@v4
        with:
          name: sentum-performance-${{ github.sha }}
          path: evidence/performance
      - name: Download operational acceptance evidence
        uses: actions/download-artifact@v4
        with:
          name: sentum-operational-acceptance-${{ github.sha }}
          path: evidence/operational
      - name: Enforce release readiness
        run: |
          python3 tools/ci/release_readiness.py \
            --performance evidence/performance/performance_gate.json \
            --operational evidence/operational/operational_acceptance.json \
            --report log/release_readiness.json \
            --summary log/release_readiness.md \
            --expected-sha "${GITHUB_SHA}"
          cat log/release_readiness.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload release readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentum-release-readiness-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            log/release_readiness.json
            log/release_readiness.md

  rc_package:
    name: Release candidate package
    needs:
      - release_readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download verified release binary
        uses: actions/download-artifact@v4
        with:
          name: sentum-rc-binary-${{ github.sha }}
          path: evidence/binary
      - name: Download release readiness evidence
        uses: actions/download-artifact@v4
        with:
          name: sentum-release-readiness-${{ github.sha }}
          path: evidence/readiness
      - name: Build deterministic RC bundle
        run: |
          chmod +x evidence/binary/sentum
          python3 tools/ci/package_release_candidate.py \
            --binary evidence/binary/sentum \
            --readiness evidence/readiness/release_readiness.json \
            --git-sha "${GITHUB_SHA}" \
            --output-dir artifacts \
            --report log/rc_package.json \
            --summary log/rc_package.md
          cat log/rc_package.md >> "$GITHUB_STEP_SUMMARY"
      - name: Validate release candidate handoff layout
        run: |
          python3 tools/ci/validate_rc_handoff.py \
            --artifact-root . \
            --expected-sha "${GITHUB_SHA}"
      - name: Upload release candidate handoff
        uses: actions/upload-artifact@v4
        with:
          name: sentum-rc-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/*.tar.gz
            artifacts/*.sha256
            log/rc_package.json
            log/rc_package.md
